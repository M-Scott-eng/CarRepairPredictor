<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e40af"/>
      <stop offset="100%" style="stop-color:#2563eb"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  
  <!-- Grid pattern overlay -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="white" stroke-opacity="0.05" stroke-width="1"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#grid)"/>
  
  <!-- Logo mark -->
  <g transform="translate(100, 200)">
    <!-- Car body -->
    <path d="M0 80h200v50a10 10 0 0 1-10 10H10a10 10 0 0 1-10-10V80z" fill="white"/>
    <path d="M25 80l25-55h100l25 55H25z" fill="white" fill-opacity="0.9"/>
    <path d="M40 35l15-30h90l15 30H40z" fill="#2563eb"/>
    <!-- Wheels -->
    <circle cx="45" cy="130" r="22" fill="#1e3a5f"/>
    <circle cx="45" cy="130" r="12" fill="white" fill-opacity="0.3"/>
    <circle cx="155" cy="130" r="22" fill="#1e3a5f"/>
    <circle cx="155" cy="130" r="12" fill="white" fill-opacity="0.3"/>
    <!-- Badge -->
    <circle cx="170" cy="25" r="40" fill="#10b981"/>
    <path d="M150 25l13 13 27-27" stroke="white" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
  
  <!-- Text -->
  <text x="350" y="280" font-family="Inter, system-ui, sans-serif" font-size="72" font-weight="700" fill="white">
    CarCheck
  </text>
  <text x="350" y="350" font-family="Inter, system-ui, sans-serif" font-size="36" font-weight="400" fill="white" fill-opacity="0.9">
    Predict Repair Costs Before You Buy
  </text>
  
  <!-- UK badge -->
  <rect x="350" y="400" width="80" height="36" rx="6" fill="white" fill-opacity="0.15"/>
  <text x="390" y="425" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="600" fill="white" text-anchor="middle">
    🇬🇧 UK
  </text>
  
  <!-- Features -->
  <g fill="white" fill-opacity="0.8" font-family="Inter, system-ui, sans-serif" font-size="20">
    <text x="350" y="500">✓ MOT History Analysis</text>
    <text x="650" y="500">✓ 20+ Car Makes</text>
    <text x="900" y="500">✓ UK Pricing</text>
  </g>
  
  <!-- URL -->
  <text x="600" y="590" font-family="Inter, system-ui, sans-serif" font-size="22" fill="white" fill-opacity="0.7" text-anchor="middle">
    carrepairpredictor.co.uk
  </text>
</svg>
